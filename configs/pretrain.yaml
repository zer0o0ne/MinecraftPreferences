# specs/pretrain.md: PretrainConfig. Paths relative to the repository root; perception,
# action_mask, policy, preference: the module configs; groups (name: {lr, weight_decay})
# of the blocks providing the modules.
index_dir: "data/train_index"
out_dir: "data/pretrain"
perception: "configs/perception.yaml"
action_mask: "configs/action-mask.yaml"
policy: "configs/policy.yaml"
preference: "configs/preference.yaml"
diagnostics: "configs/diagnostics.yaml"
seed: 0
epochs: 1
retrain: true
batch: 16
micro_batch: 1
diagnostic_window: 100
reference_steps: 500
reference_pairs: 64
calibration_bins: 10
saturation_threshold: 0.01
inc_classification_threshold: 0.5
quantiles: [0.05, 0.5, 0.95]
action_copy_eps: 0.1
latent_init_scale: 1.0
w_phi: 0.3
w_pi: 1.0
w_P: 1.0
groups:
  phi_vision: {lr: 1.0e-5, weight_decay: 0.01}
  phi_vision_no_decay: {lr: 1.0e-5, weight_decay: 0.0}
  phi_llm: {lr: 1.0e-5, weight_decay: 0.01}
  phi_llm_no_decay: {lr: 1.0e-5, weight_decay: 0.0}
  phi_head: {lr: 1.0e-4, weight_decay: 0.01}
  phi_head_no_decay: {lr: 1.0e-4, weight_decay: 0.0}
  phi_dual: {lr: 1.0e-4, weight_decay: 0.0}
  pi: {lr: 3.0e-4, weight_decay: 0.01}
  pi_no_decay: {lr: 3.0e-4, weight_decay: 0.0}
  P: {lr: 3.0e-4, weight_decay: 0.01}
  P_no_decay: {lr: 3.0e-4, weight_decay: 0.0}
betas: [0.9, 0.999]
adam_eps: 1.0e-8
warmup_steps: 100
lr_floor: 0.1
grad_clip: 1.0
checkpoint_steps: 100
keep_checkpoints: 2
device: "cuda"
