# specs/vlm-labels.md: VlmLabelsConfig. Paths relative to the repository root.
# A text ends with \n where another text part follows it directly.
extends:
  - "configs/meta.yaml"
pool_dir: "data/pair_clips"
vlm: "configs/integrations/vlm.yaml"
out_dir: "data/pair_votes"
diagnostics: "configs/diagnostics.yaml"
acyclic: "configs/datasets/preferences/acyclic.yaml"
instruction: "You will see two moments, A and B, from the same game of Minecraft Java
  Edition 1.16 in survival mode, played by one player in one world. Each moment is shown
  as a few screenshots taken shortly one after another, oldest first; the last screenshot
  is the moment itself. After the screenshots comes the player's inventory at that
  moment.\nEvaluate each moment on three criteria: available potential for gathering
  resources of every kind, safety, and current level of progress. Compare the moments
  only under the following rules:\n1. If one moment is Pareto-better (at least as good
  on every criterion and strictly better on at least one), use the six graded answers to
  indicate how much better or worse A is than B.\n2. Exception: if one moment is only
  very slightly worse on some criteria but much better on others, treat it as nearly
  Pareto-better and compare the moments using the same six answers.\n3. If the moments
  are approximately equal on all three criteria, you may choose between them on aesthetic
  grounds, especially the beauty or rarity of the situation. Prefer the more beautiful
  or rarer moment when differences in resource-gathering potential, safety, and progress
  are negligible.\nOtherwise, answer INCOMPARABLE.\n\n"
first: "Moment A:\n"
second: "Moment B:\n"
question: "How good is moment A for the player compared with moment B? Explain in at
  most three short sentences, then write a last line of the form Answer: TOKEN, with
  TOKEN one of:\n{answers}"
answer_line: "{token}: {description}"
prefix: "Answer: "
inventory_line: "Inventory: {items}\n\n"
answers:
  - token: "MUCH_BETTER"
    description: "A is much better than B"
  - token: "BETTER"
    description: "A is better than B"
  - token: "SLIGHTLY_BETTER"
    description: "A is slightly better than B"
  - token: "SLIGHTLY_WORSE"
    description: "A is slightly worse than B"
  - token: "WORSE"
    description: "A is worse than B"
  - token: "MUCH_WORSE"
    description: "A is much worse than B"
  - token: "INCOMPARABLE"
    description: "A and B cannot be compared"
frames: 6
stride: 2
samples: 1
seed: 0
