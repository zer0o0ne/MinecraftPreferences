extends:
  - configs/training/pretrain/base.yaml
remove:
  - batch
  - micro_batch
index_dir: data/train_index_continuous_labeled
out_dir: data/pretrain_continuous_labeled
precision: fp32
diagnostics: configs/diagnostics-continuous.yaml
publish_diagnostics: false
checkpoint_steps: 1000
diagnostic_window: 1000
reference_steps: 5000
# Keep the bounded K-observation activations to avoid repeated recomputation.
activation_checkpointing: false
tbptt_states: 4
batch_size: 16
preference_micro_batch: 32
archive_shard_size: 256
archive_cache_size: 256
archive_keep_shards: 2
