[project]
name = "mcpref"
version = "0.1.0"
requires-python = "==3.10.*"
dependencies = [
    "fla-core==0.5.2 ; platform_machine == 'aarch64' and sys_platform == 'linux'",
    "httpx==0.28.1",
    "igraph==1.0.0",
    "minestudio==1.1.6",
    "numpy==1.26.4",
    "opencv-python==4.8.0.74",
    "opencv-python-headless==4.8.0.74",
    "pillow==12.3.0",
    "psutil==7.2.2",
    "pyyaml==6.0.3",
    "texttable==1.7.0",
    "tokenizers==0.23.3",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "tqdm==4.70.1",
    "transformers==5.20.2",
]

[build-system]
requires = ["uv_build==0.12.19"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = [
    "gpu: needs a GPU; skipped on this machine",
    "slow: slow tier; deselected by default",
]
addopts = "-m 'not gpu and not slow' -n auto --timeout=10 --durations=10"

[tool.uv]
required-version = "==0.12.19"
override-dependencies = ["networkx==3.4.2"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "ruff==0.16.9",
]
