[project]
name = "mcpref"
version = "0.1.0"
requires-python = "==3.10.*"
dependencies = [
    "numpy==1.26.4",
    "pyyaml==6.0.3",
]

[build-system]
requires = ["uv_build==0.12.19"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = [
    "gpu: needs a GPU; skipped on this machine",
    "slow: slow tier; deselected by default",
]
addopts = "-m 'not gpu and not slow' -n auto --timeout=10 --durations=10"

[tool.uv]
required-version = "==0.12.19"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "ruff==0.16.9",
]
